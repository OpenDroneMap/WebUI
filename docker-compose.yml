# This configuration does not include a processing node
# Which makes for faster setup times
version: '2.1'
volumes:
  dbdata:
  appmedia:
services:
  db:
    image: postgis/postgis:18-3.6-alpine
    container_name: db
    expose:
      - "5432"
    volumes:
      - ${WO_DB_DIR}:/var/lib/postgresql:z
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      # - POSTGRES_DB=webodm_dev
      # - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 15s
        retries: 10
        start_period: 30s
        timeout: 10s
    command: >
      postgres
      -c autovacuum_max_workers=6
      -c autovacuum_naptime=15s
      -c autovacuum_vacuum_threshold=25
      -c autovacuum_vacuum_scale_factor=0.1
      -c autovacuum_analyze_threshold=10
      -c autovacuum_analyze_scale_factor=0.05
      -c autovacuum_vacuum_cost_delay=10ms
      -c autovacuum_vacuum_cost_limit=1000
    restart: unless-stopped
    oom_score_adj: -100
  webapp:
    build: .
    container_name: webapp
    entrypoint: /bin/bash -c "crond && chmod +x /webodm/*.sh && /bin/bash -c \"/webodm/wait-for-postgres.sh db /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/start.sh\""
    volumes:
      - ${WO_MEDIA_DIR}:/webodm/app/media:z
    ports:
      - "${WO_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
      worker:
        condition: service_started
    environment:
      - PGPASSWORD=postgres
      - WO_PORT
      - WO_HOST
      - WO_DEBUG
      - WO_BROKER
      - WO_DEV
      - WO_DEV_WATCH_PLUGINS
      - WO_SECRET_KEY
      - WEB_CONCURRENCY
    restart: unless-stopped
    oom_score_adj: 0
  broker:
    image: valkey/valkey:9.1.0-alpine3.23
    container_name: broker
    restart: unless-stopped
    oom_score_adj: -500
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    container_name: worker
    entrypoint: /bin/bash -c "/webodm/wait-for-postgres.sh db /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/wait-for-it.sh -t 0 webapp:8000 -- /webodm/worker.sh start"
    volumes:
      - ${WO_MEDIA_DIR}:/webodm/app/media:z
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    environment:
      - PGPASSWORD=postgres
      - WO_BROKER
      - WO_DEBUG
      - WO_SECRET_KEY
      - WEB_CONCURRENCY
    restart: unless-stopped
    oom_score_adj: 250

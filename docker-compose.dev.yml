version: '2.1'
services:
  webapp:
    entrypoint: /bin/bash -c "chmod +x /webui/*.sh && /bin/bash -c \"/webui/wait-for-postgres.sh db /webui/wait-for-it.sh -t 0 broker:6379 -- /webui/start.sh --create-default-pnode --setup-devenv\""
    ports:
      - "35729:35729"
    volumes:
      - .:/webui
      - /webui/venv
  worker:
    volumes:
      - .:/webui
      - /webui/venv